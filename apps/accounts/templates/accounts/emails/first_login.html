<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <p>Hi {{ user.first_name }},</p>
    <p>This is your first sign-in to {{ site_name }}. Use this one-time code to finish logging in:</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold;">{{ code }}</p>
    <p>This code expires in {{ minutes }} minutes. If you did not try to sign in, reset your password immediately.</p>
  </body>
</html>
