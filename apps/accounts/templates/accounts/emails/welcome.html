<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <p>Hi {{ user.first_name }},</p>
    <p>{{ inviter_name }} has given you access to <strong>{{ organization_name }}</strong> on {{ site_name }}.</p>
    <p><a href="{{ login_url }}" style="color: #2563eb;">Sign in</a> with your email address and this temporary password:</p>
    <p style="font-size: 20px; letter-spacing: 2px; font-weight: bold;">{{ temp_password }}</p>
    <p>You'll be asked to verify a one-time code on first sign-in, then set a password of your own.</p>
  </body>
</html>
