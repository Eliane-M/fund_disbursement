<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <p>Hi {{ user.first_name }},</p>
    <p>Use this code to verify your {{ site_name }} email address:</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold;">{{ code }}</p>
    <p>This code expires in {{ minutes }} minutes. If you did not create an account, you can ignore this email.</p>
  </body>
</html>
